# FreshLens — pipeline configuration.
# Everything an analyst might want to tweak lives here, not in code.

source:
  base_url: https://api.data.gov.in/resource
  # "Current Daily Price of Various Commodities from Various Markets (Mandi)".
  # Holds ONLY the latest arrival day, so the daily job must run every day to build history.
  daily_resource_id: 9ef84268-d588-465a-a308-a864a43d0070
  # "Variety-wise Daily Market Prices Data of Commodity" — history from 2010 (used for backfill).
  history_resource_id: 35985678-0d79-46b4-9ed6-6f13308a1d24
  page_size: 1000          # the server may cap this lower (the public sample key gets 10)
  request_timeout_s: 30
  max_retries: 6

# Items a Delhi NCR quick-commerce dark store sells every day: source name (as Agmarknet spells
# it, used in API filters) → category. Every item has 2,000+ days of Azadpur history.
commodities:
  Tomato: vegetable
  Onion: vegetable
  Potato: vegetable
  Green Chilli: vegetable
  Garlic: vegetable
  Ginger(Green): vegetable
  Cauliflower: vegetable
  Cabbage: vegetable
  Brinjal: vegetable
  Bhindi(Ladies Finger): vegetable
  Capsicum: vegetable
  Carrot: vegetable
  Cucumbar(Kheera): vegetable
  Bottle gourd: vegetable
  Bitter gourd: vegetable
  Pumpkin: vegetable
  Raddish: vegetable
  Peas Wet: vegetable
  Lemon: vegetable
  Coriander(Leaves): herb
  Apple: fruit
  Banana: fruit
  Mango: fruit
  Papaya: fruit
  Grapes: fruit
  Mousambi(Sweet Lime): fruit
  Pomegranate: fruit
  Water Melon: fruit
  Guava: fruit
  Pineapple: fruit

# How items are shown to people (dashboard + dim_commodity.display_name). Missing = source name.
display_names:
  Ginger(Green): Ginger
  Bhindi(Ladies Finger): Okra
  Cucumbar(Kheera): Cucumber
  Bottle gourd: Bottle Gourd
  Bitter gourd: Bitter Gourd
  Raddish: Radish
  Peas Wet: Green Peas
  Coriander(Leaves): Coriander
  Mousambi(Sweet Lime): Sweet Lime
  Water Melon: Watermelon
  Brinjal: Eggplant (Brinjal)

# Where the dark stores are. Terminal markets in this state are the "destination" side.
home_state: NCT of Delhi

# Pan-India coverage: each city's main wholesale (APMC) markets, spelled exactly as the API spells them.
# A city's price for an item on a day = median across its markets that reported. Every market listed
# has 15+ years of history for the staples. Chennai is left out: Koyambedu barely reports to Agmarknet.
cities:
  Delhi NCR:  [Azadpur]
  Mumbai:     [Mumbai, Vashi New Mumbai]
  Pune:       [Pune, Pune(Manjri)]
  Bengaluru:  ["Binny Mill (F&V), Bangalore", Bangalore]
  Hyderabad:  [Bowenpally, Gudimalkapur]
  Kolkata:    [Sealdah Koley Market, Bara Bazar (Posta Bazar)]
  Lucknow:    [Lucknow]
  Jaipur:     [Jaipur (F&V)]
  Chandigarh: [Chandigarh(Grain/Fruit)]
  Ahmedabad:  [Ahmedabad]

history:
  hub_market: Azadpur        # Delhi's benchmark (used by the findings report)
  extra_scopes: []

# Sourcing lanes: source market → destination city. freight_per_kg is an ASSUMPTION (₹/kg, truck,
# incl. handling); replace with real lane rates. The spread is only as good as this number.
lanes:
  - {commodity: Onion,  source: Lasalgaon,   city: Delhi NCR, freight_per_kg: 2.5}
  - {commodity: Onion,  source: Pimpalgaon,  city: Delhi NCR, freight_per_kg: 2.5}
  - {commodity: Tomato, source: Kolar,       city: Delhi NCR, freight_per_kg: 4.0}
  - {commodity: Tomato, source: Madanapalli, city: Delhi NCR, freight_per_kg: 4.0}
  - {commodity: Potato, source: Agra,        city: Delhi NCR, freight_per_kg: 1.0}
  - {commodity: Onion,  source: Lasalgaon,   city: Mumbai,    freight_per_kg: 1.0}
  - {commodity: Onion,  source: Pimpalgaon,  city: Mumbai,    freight_per_kg: 1.0}
  - {commodity: Onion,  source: Lasalgaon,   city: Pune,      freight_per_kg: 1.0}
  - {commodity: Tomato, source: Kolar,       city: Bengaluru, freight_per_kg: 0.5}
  - {commodity: Tomato, source: Madanapalli, city: Bengaluru, freight_per_kg: 1.0}
  - {commodity: Tomato, source: Madanapalli, city: Hyderabad, freight_per_kg: 1.5}
  - {commodity: Tomato, source: Kolar,       city: Hyderabad, freight_per_kg: 2.0}
  - {commodity: Onion,  source: Lasalgaon,   city: Kolkata,   freight_per_kg: 3.5}
  - {commodity: Potato, source: Agra,        city: Lucknow,   freight_per_kg: 1.0}
  - {commodity: Potato, source: Agra,        city: Jaipur,    freight_per_kg: 1.2}

analysis:
  max_lag_days: 10           # lead-lag search window
  min_overlap_days: 60       # don't trust a correlation computed on fewer paired days
  min_corr: 0.15             # below this a "lead" is noise, so report "no lead detected"
  weekly_max_lag_weeks: 6
  weekly_min_overlap_weeks: 52
  max_return_gap_days: 3     # a day-on-day return across a longer reporting gap is dropped
  spike_threshold_pct: 10    # source-mandi week-on-week rise (weekly median) that triggers an alert
  volatility_windows: [7, 30]

quality:
  max_quarantine_rate: 0.05  # warn if more than 5% of a load fails row-level rules
  freshness_days: 3          # latest arrival_date must be within N days of the run date
  stopped_reporting_days: 7  # a tracked mandi silent for N days is flagged
  max_price_per_kg: 1000     # anything above is a unit/typo error, not a price

# Cleaning: map messy source spellings to one canonical name (case-insensitive keys).
aliases:
  market:
    "azadpur apmc": Azadpur
    "madanapalle": Madanapalli
  commodity: {}
