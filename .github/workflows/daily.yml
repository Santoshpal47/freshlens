# Nightly refresh, entirely on GitHub's servers (no laptop needed).
#
# api.data.gov.in only answers Indian IP addresses and GitHub's runners are abroad, so requests go
# through the FreshLens relay (relay/, a Vercel function pinned to Mumbai, shared-key protected).
#
#   data branch    append-only raw landing zone (gzip JSON) = the durable source of truth
#   Actions cache  the Delta lake, so most nights only the last few landed days are processed
#   deploy branch  code + a fresh 1-2 MB dashboard snapshot, replaced every night (never grows);
#                  Streamlit Community Cloud serves the public dashboard from it
#
# Needs: secrets DATA_GOV_IN_API_KEY, FRESHLENS_RELAY_KEY; variable FRESHLENS_API_BASE.
name: daily-refresh

on:
  schedule:
    - cron: "30 13 * * *" # 19:00 IST: early snapshot of the day
    - cron: "0 17 * * *"  # 22:30 IST: after most markets have reported (later snapshot wins in silver)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      FRESHLENS_RELAY_KEY: ${{ secrets.FRESHLENS_RELAY_KEY }}
      FRESHLENS_API_BASE: ${{ vars.FRESHLENS_API_BASE }}
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out raw landing zone (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/raw

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync

      - name: Land today's prices (via the India relay)
        run: uv run freshlens daily --land-only

      - name: Persist raw snapshot to the data branch
        working-directory: data/raw
        run: |
          git config user.name "freshlens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "raw: snapshot $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          git push -q origin HEAD:data

      - name: Restore Delta lake
        uses: actions/cache/restore@v4
        with:
          path: data/lake
          key: lake-${{ github.run_id }}
          restore-keys: lake-

      - name: Build the lake (incremental, or full rebuild on a cold cache)
        run: |
          if [ -d data/lake/silver/prices/_delta_log ]; then
            # re-run the last 3 landed days: idempotent, and heals a night that failed after landing
            for d in $(ls -d data/raw/daily/ingest_date=* | sed 's/.*=//' | sort | tail -3); do
              uv run freshlens daily --no-fetch --date "$d"
            done
          else
            uv run freshlens rebuild
          fi

      - name: Save Delta lake
        uses: actions/cache/save@v4
        with:
          path: data/lake
          key: lake-${{ github.run_id }}

      - name: Export dashboard snapshot
        run: uv run freshlens export

      - name: Publish deploy branch (code + snapshot, single commit)
        run: |
          out=$(mktemp -d)
          git archive HEAD | tar -x -C "$out"
          rm -rf "$out/.github"                       # no workflows on the deploy branch
          mkdir -p "$out/dashboard/snapshot"
          cp dashboard/snapshot/*.parquet "$out/dashboard/snapshot/"
          cd "$out"
          git init -q -b deploy
          git config user.name "freshlens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f dashboard/snapshot                # .gitignore (copied from main) excludes it
          test -n "$(git ls-files dashboard/snapshot)"  # never publish a deploy without data
          git commit -qm "deploy: code ${GITHUB_SHA::7} + data $(date -u +%F)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
